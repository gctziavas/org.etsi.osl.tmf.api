origins: http://localhost,http://localhost:8888,http://localhost:13082,http://127.0.0.1:13082,https://localhost, 
permit-all: /tmf-api/**


server:
  port: 13082
  servlet:
    context-path : /tmf-api
  error:
    include-message: always
  ssl:
    enabled: false
    
springdoc:
  version: '@springdoc.version@'
  writer-with-default-pretty-printer: true
  swagger-ui:
    display-request-duration: true
    groups-order: ASC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
    oauth:
      client-id: osapiWebClientId
      clientsecret: "secret"
      use-pkce-with-authorization-code-grant: false
  oAuthFlow:
    authorizationUrl: http://keycloak:8080/auth/realms/openslice/protocol/openid-connect/auth
    tokenUrl: http://keycloak:8080/auth/realms/openslice/protocol/openid-connect/token
  show-actuator: true

spring-addons:
  issuers:
  - uri: http://keycloak:8080/auth/realms/openslice
    username-json-path: $.preferred_username
    claims:
    - jsonPath: $.realm_access.roles
    - jsonPath: $.resource_access.*.roles

spring:
  config:
    activate:
      on-profile: "default"
  application:
    name: openslice-service-catalog-management-api
  datasource:
    url: jdbc:mysql://localhost:13306/ostmfdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    password: letmein
    username: root
    hikari:
       minimumIdle: 2
       maximumPoolSize: 20
       idleTimeout: 20000
       idle-timeout: 20000
       connectionTimeout: 40000
       leakDetectionThreshold: 40000
       
       
  jpa:
    database-platform: org.etsi.osl.tmf.LocalMysqlDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    generate-ddl: true
    properties.hibernate.current_session_context_class: org.springframework.orm.hibernate5.SpringSessionContext 
    properties:
      hibernate:
        connection:
          characterEncoding: utf-8
          CharSet: utf-8
          useUnicode: true 
  servlet:
    multipart.max-file-size: 10MB
    multipart.max-request-size: 10MB
  activemq:
    brokerUrl: tcp://localhost:61616?jms.watchTopicAdvisories=false
    user: artemis
    password: artemis
    pool:
      enabled: true
      max-connections: 100
    packages:
      trust-all: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/auth/realms/openslice
          jwk-set-uri: http://keycloak:8080/auth/realms/openslice/.well-known/openid-configuration
  

logging:
  level:
    root: INFO
    portal.api: INFO
    org.etsi.osl.tmf.*: DEBUG
    org.springframework: INFO
    org.apache.camel: INFO 
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
    file: "%d %p %c{1.} [%t] %m%n"
    
  
    

kroki:
  serverurl: http://localhost:8000

oauthsign:
   key: "EK97Y7Y9WPGG1MEG"

