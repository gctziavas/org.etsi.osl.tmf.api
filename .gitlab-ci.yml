stages:
  - java_build
  - docker_build

variables:
  APP_VERSION: "1.2.0-SNAPSHOT"

deploy_jar:
  stage: java_build
  image: maven:3.9.5-ibm-semeru-17-focal
  script:
    - mvn deploy -s ci_settings.xml -DskipTests

download_jar:
  stage: docker_build
  variables:
    LOGGING_STRATEGY: "-q"
  image: maven:3.9.5-ibm-semeru-17-focal
  script:
    - echo "Maven logging strategy set to quiet. For more verbosity, change LOGGING_STRATEGY in the job configuration."
    - mvn -s ci_settings.xml $LOGGING_STRATEGY dependency:get -Dartifact=org.etsi.osl:org.etsi.osl.tmf.api:$APP_VERSION
    - mvn -s ci_settings.xml dependency:copy -Dartifact=org.etsi.osl:org.etsi.osl.tmf.api:$APP_VERSION -DoutputDirectory=target/
    - mv target/org.etsi.osl.tmf.api-*.jar target/org.etsi.osl.tmf.api-${APP_VERSION}-exec.jar
  artifacts:
    paths:
      - target/
      
build_image:
  stage: docker_build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        if [ -n "$CI_COMMIT_TAG" ]; then
          IMAGE_TAG=$CI_COMMIT_TAG
        else
          IMAGE_TAG="latest" # Default tag if no specific tag is found
        fi
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        IMAGE_TAG="develop"
      else
        IMAGE_TAG=$APP_VERSION
      fi
      echo "Building Docker image with tag $IMAGE_TAG"
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - if: '$CI_COMMIT_REF_NAME == "12-create-a-pipeline-to-build-and-publish-the-docker-image-in-gitlab-registry"'
  needs:
    - download_jar
